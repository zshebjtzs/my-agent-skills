name: Add Skill

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-external-skill-pr:
    if: startsWith(github.event.issue.title, '[Skill]')
    runs-on: ubuntu-latest
    steps:
      - name: Create a catalog pull request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const field = (label) => {
              const match = body.match(new RegExp('### ' + label + '\\s*\\n+([\\s\\S]*?)(?=\\n### |$)', 'i'));
              const value = match?.[1]?.trim();
              return value && value !== '_No response_' ? value : '';
            };

            const fail = async (message) => {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: 'Skill submission could not be automated: ' + message
              });
            };

            const name = field('Skill name');
            const category = field('Category').toLowerCase();
            const repositoryUrl = field('GitHub repository').trim();
            const rawPath = field('Skill directory path').trim();
            const requestedRef = field('Branch, tag, or commit').trim();
            let parsedUrl;
            try { parsedUrl = new URL(repositoryUrl); } catch { parsedUrl = null; }
            const repoParts = parsedUrl?.pathname.split('/').filter(Boolean) || [];
            const validRepoUrl = parsedUrl?.protocol === 'https:' && parsedUrl?.hostname === 'github.com' && repoParts.length === 2;
            const owner = validRepoUrl ? repoParts[0] : '';
            const sourceRepoName = validRepoUrl ? repoParts[1].replace(/\\.git$/i, '') : '';
            const skillPath = rawPath.split('/').filter(Boolean).join('/');
            const validPath = rawPath.length > 0 && !rawPath.startsWith('/') &&
              !rawPath.split('/').some(part => part === '.' || part === '..') &&
              new RegExp('^[A-Za-z0-9_./-]+$').test(rawPath);

            if (!name || !['personal', 'community', 'shared'].includes(category) ||
                !validRepoUrl || !sourceRepoName || !validPath) {
              await fail('please check the Skill name, category, public GitHub repository URL, and repository-relative Skill directory path.');
              return;
            }

            const repository = owner + '/' + sourceRepoName;
            const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            if (!slug) {
              await fail('the Skill name must contain at least one English letter or number so it can form a catalog ID.');
              return;
            }
            const id = category + '-' + slug;
            const branch = 'add-skill/issue-' + issue.number;

            const { data: existing } = await github.rest.pulls.list({
              ...context.repo, state: 'all', head: context.repo.owner + ':' + branch
            });
            if (existing.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'A pull request already exists for this submission: ' + existing[0].html_url
              });
              return;
            }

            const { data: repoData } = await github.rest.repos.get({ ...context.repo });
            const base = repoData.default_branch;
            const { data: refData } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/' + base });
            const { data: catalogFile } = await github.rest.repos.getContent({
              ...context.repo, path: 'catalog/external-skills.json', ref: base
            });
            const catalog = JSON.parse(Buffer.from(catalogFile.content, 'base64').toString('utf8'));

            if (catalog.some(item => item.id === id)) {
              await fail('a Skill with this catalog ID already exists: ' + id);
              return;
            }

            const { data: sourceRepoData } = await github.rest.repos.get({ owner, repo: sourceRepoName });
            if (sourceRepoData.private || sourceRepoData.archived) {
              await fail('the source repository must be public and not archived.');
              return;
            }

            const newEntry = {
              id,
              name,
              category,
              tags: [],
              source: {
                type: 'external',
                repository,
                ref: requestedRef || sourceRepoData.default_branch,
                path: skillPath
              }
            };

            await github.rest.git.createRef({
              ...context.repo,
              ref: 'refs/heads/' + branch,
              sha: refData.object.sha
            });

            catalog.push(newEntry);
            const content = Buffer.from(JSON.stringify(catalog, null, 2) + '\\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path: 'catalog/external-skills.json',
              message: 'catalog: add ' + name,
              content,
              sha: catalogFile.sha,
              branch
            });

            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              title: 'catalog: add ' + name,
              head: branch,
              base,
              body: [
                '## Summary',
                '- Add external Skill **' + name + '** to the catalog.',
                '- Source: ' + repository + ' / ' + skillPath,
                '- Category: ' + category,
                '',
                'The Pages build validates the source directory and generates its preview and ZIP download.',
                '',
                'Closes #' + issue.number
              ].join('\\n')
            });

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: 'Created pull request: ' + pr.html_url
            });

  create-local-skill-pr:
    if: startsWith(github.event.issue.title, '[Local Skill]')
    runs-on: ubuntu-latest
    steps:
      - name: Create a Skill directory pull request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const field = (label) => {
              const match = body.match(new RegExp('### ' + label + '\\s*\\n+([\\s\\S]*?)(?=\\n### |$)', 'i'));
              const value = match?.[1]?.trim();
              return value && value !== '_No response_' ? value : '';
            };
            const marked = (name) => {
              const escaped = name.replace(/[.*+?^$\\{\\}()|[\\]\\\\]/g, '\\\\$&');
              const match = body.match(new RegExp('<!-- BEGIN ' + escaped + ' -->([\\s\\S]*?)<!-- END ' + escaped + ' -->'));
              return match?.[1]?.replace(/^\\s*\\n|\\n\\s*$/g, '') ?? '';
            };
            const fail = async (message) => {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: 'Local Skill submission could not be automated: ' + message
              });
            };

            const name = field('Skill name');
            const category = field('Category').toLowerCase();
            const skillContent = marked('SKILL.md');
            const readmeContent = marked('README.md');
            const extraFilesRaw = marked('Additional files JSON');
            if (!name || !['personal', 'community', 'shared'].includes(category) || !skillContent.trim()) {
              await fail('please provide a Skill name, a valid category, and the complete SKILL.md content between the supplied markers.');
              return;
            }

            const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            if (!slug) {
              await fail('the Skill name must contain at least one English letter or number so it can form a directory name.');
              return;
            }
            const directory = 'skills/' + category + '/' + slug;
            const files = new Map([['SKILL.md', skillContent]]);
            if (readmeContent.trim()) files.set('README.md', readmeContent);

            if (extraFilesRaw.trim()) {
              let extraFiles;
              try { extraFiles = JSON.parse(extraFilesRaw); }
              catch {
                await fail('Additional files JSON is not valid JSON. Use an object mapping relative file paths to their text contents.');
                return;
              }
              if (!extraFiles || Array.isArray(extraFiles) || typeof extraFiles !== 'object') {
                await fail('Additional files JSON must be an object mapping file paths to text contents.');
                return;
              }
              for (const [path, content] of Object.entries(extraFiles)) {
                if (typeof content !== 'string' || !path || path.startsWith('/') ||
                    path.includes('\\\\') || path.split('/').some(part => !part || part === '.' || part === '..' || part === '.git') ||
                    !/^[A-Za-z0-9_.@+-]+(?:\\/[A-Za-z0-9_.@+-]+)*$/.test(path)) {
                  await fail('invalid additional file path or content: ' + path);
                  return;
                }
                if (files.has(path)) {
                  await fail('duplicate file path: ' + path);
                  return;
                }
                files.set(path, content);
              }
            }

            const totalBytes = [...files.values()].reduce((sum, value) => sum + Buffer.byteLength(value, 'utf8'), 0);
            if (files.size > 30 || totalBytes > 45000) {
              await fail('this Issue supports at most 30 files and 45 KB of text. For larger Skills, use a source repository and the external Skill submission form.');
              return;
            }

            const branch = 'add-local-skill/issue-' + issue.number;
            const { data: existing } = await github.rest.pulls.list({
              ...context.repo, state: 'all', head: context.repo.owner + ':' + branch
            });
            if (existing.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'A pull request already exists for this submission: ' + existing[0].html_url
              });
              return;
            }

            const { data: repoData } = await github.rest.repos.get({ ...context.repo });
            const base = repoData.default_branch;
            const { data: refData } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/' + base });
            const { data: commitData } = await github.rest.git.getCommit({
              ...context.repo, commit_sha: refData.object.sha
            });
            const { data: existingPath } = await github.rest.repos.getContent({
              ...context.repo, path: directory, ref: base
            }).catch(error => {
              if (error.status === 404) return { data: null };
              throw error;
            });
            if (existingPath) {
              await fail('a Skill directory already exists at ' + directory + '. Choose a different Skill name or update the existing Skill manually.');
              return;
            }

            const entries = [...files.entries()].map(([path, content]) => ({
              path: directory + '/' + path,
              mode: '100644',
              type: 'blob',
              content
            }));
            const { data: tree } = await github.rest.git.createTree({
              ...context.repo,
              base_tree: commitData.tree.sha,
              tree: entries
            });
            const { data: commit } = await github.rest.git.createCommit({
              ...context.repo,
              message: 'skills: add ' + name,
              tree: tree.sha,
              parents: [refData.object.sha]
            });
            await github.rest.git.createRef({
              ...context.repo,
              ref: 'refs/heads/' + branch,
              sha: commit.sha
            });

            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              title: 'skills: add ' + name,
              head: branch,
              base,
              body: [
                '## Summary',
                '- Add local Skill **' + name + '**.',
                '- Directory: `' + directory + '`',
                '- Category: ' + category,
                '- Files: ' + [...files.keys()].map(path => '`' + path + '`').join(', '),
                '',
                'The Pages build discovers the new Skill automatically and generates its preview and ZIP download.',
                '',
                'Closes #' + issue.number
              ].join('\\n')
            });
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: 'Created pull request: ' + pr.html_url
            });
