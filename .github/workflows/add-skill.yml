name: Add external Skill

on:
  issues:
    types: [opened]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-skill-pr:
    if: startsWith(github.event.issue.title, '[Skill]')
    runs-on: ubuntu-latest
    steps:
      - name: Create a catalog pull request
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const field = (label) => {
              const match = body.match(new RegExp('### ' + label + '\\s*\\n+([\\s\\S]*?)(?=\\n### |$)', 'i'));
              const value = match?.[1]?.trim();
              return value && value !== '_No response_' ? value : '';
            };

            const fail = async (message) => {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: 'Skill submission could not be automated: ' + message
              });
            };

            const name = field('Skill name');
            const category = field('Category').toLowerCase();
            const repositoryUrl = field('GitHub repository').trim();
            const rawPath = field('Skill directory path').trim();
            const requestedRef = field('Branch, tag, or commit').trim();
            let parsedUrl;
            try { parsedUrl = new URL(repositoryUrl); } catch { parsedUrl = null; }
            const repoParts = parsedUrl?.pathname.split('/').filter(Boolean) || [];
            const validRepoUrl = parsedUrl?.protocol === 'https:' && parsedUrl?.hostname === 'github.com' && repoParts.length === 2;
            const owner = validRepoUrl ? repoParts[0] : '';
            const sourceRepoName = validRepoUrl ? repoParts[1].replace(/\.git$/i, '') : '';
            const skillPath = rawPath.split('/').filter(Boolean).join('/');
            const validPath = rawPath.length > 0 && !rawPath.startsWith('/') &&
              !rawPath.split('/').some(part => part === '.' || part === '..') &&
              new RegExp('^[A-Za-z0-9_./-]+$').test(rawPath);

            if (!name || !['personal', 'community', 'shared'].includes(category) ||
                !validRepoUrl || !sourceRepoName || !validPath) {
              await fail('please check the Skill name, category, public GitHub repository URL, and repository-relative Skill directory path.');
              return;
            }

            const repository = owner + '/' + sourceRepoName;
            const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
            if (!slug) {
              await fail('the Skill name must contain at least one English letter or number so it can form a catalog ID.');
              return;
            }
            const id = category + '-' + slug;
            const branch = 'add-skill/issue-' + issue.number;

            const { data: existing } = await github.rest.pulls.list({
              ...context.repo, state: 'all', head: context.repo.owner + ':' + branch
            });
            if (existing.length) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'A pull request already exists for this submission: ' + existing[0].html_url
              });
              return;
            }

            const { data: repoData } = await github.rest.repos.get({ ...context.repo });
            const base = repoData.default_branch;
            const { data: refData } = await github.rest.git.getRef({ ...context.repo, ref: 'heads/' + base });
            const { data: catalogFile } = await github.rest.repos.getContent({
              ...context.repo, path: 'catalog/external-skills.json', ref: base
            });
            const catalog = JSON.parse(Buffer.from(catalogFile.content, 'base64').toString('utf8'));

            if (catalog.some(item => item.id === id)) {
              await fail('a Skill with this catalog ID already exists: ' + id);
              return;
            }

            const { data: sourceRepoData } = await github.rest.repos.get({ owner, repo: sourceRepoName });
            if (sourceRepoData.private || sourceRepoData.archived) {
              await fail('the source repository must be public and not archived.');
              return;
            }

            const newEntry = {
              id,
              name,
              category,
              tags: [],
              source: {
                type: 'external',
                repository,
                ref: requestedRef || sourceRepoData.default_branch,
                path: skillPath
              }
            };

            await github.rest.git.createRef({
              ...context.repo,
              ref: 'refs/heads/' + branch,
              sha: refData.object.sha
            });

            catalog.push(newEntry);
            const content = Buffer.from(JSON.stringify(catalog, null, 2) + '\n').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path: 'catalog/external-skills.json',
              message: 'catalog: add ' + name,
              content,
              sha: catalogFile.sha,
              branch
            });

            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              title: 'catalog: add ' + name,
              head: branch,
              base,
              body: [
                '## Summary',
                '- Add external Skill **' + name + '** to the catalog.',
                '- Source: ' + repository + ' / ' + skillPath,
                '- Category: ' + category,
                '',
                'The Pages build validates the source directory and generates its preview and ZIP download.',
                '',
                'Closes #' + issue.number
              ].join('\n')
            });

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: 'Created pull request: ' + pr.html_url
            });
