name: Add a local Skill
description: Submit the contents of a Skill and let GitHub Actions create its directory and pull request.
title: "[Local Skill] "
labels: ["skill-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Submit a local Skill without editing the repository directly. The automation creates a pull request; the Skill appears on the portal after review and merge.

        Choose one submission method:
        - **Simple Skill:** paste SKILL.md and optional extra text files as JSON.
        - **Complex Skill:** upload one ZIP containing the complete Skill directory. The ZIP must contain exactly one SKILL.md at its root or inside one top-level project folder.

        Do not fill in both methods. ZIP submissions accept UTF-8 text files only; binary assets are not supported yet.
  - type: input
    id: skill-name
    attributes:
      label: Skill name
      description: Display name; the directory slug is generated automatically.
      placeholder: My New Skill
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - personal
        - community
        - shared
    validations:
      required: true
  - type: upload
    id: skill-zip
    attributes:
      label: Skill ZIP archive
      description: For a multi-file Skill, upload one .zip containing SKILL.md and its supporting folders. Leave this empty when using the JSON fields below.
    validations:
      required: false
      accept: ".zip"
  - type: textarea
    id: skill-md
    attributes:
      label: SKILL.md content
      description: Paste the entire file between the markers. Markdown headings and code fences are supported.
      value: |
        [[BEGIN SKILL.md]]

        [[END SKILL.md]]
      render: markdown
    validations:
      required: true
  - type: textarea
    id: readme-md
    attributes:
      label: README.md content
      description: Optional visitor-facing introduction. Leave the markers empty to omit README.md.
      value: |
        [[BEGIN README.md]]

        [[END README.md]]
      render: markdown
    validations:
      required: false
  - type: textarea
    id: extra-files
    attributes:
      label: Additional files JSON
      description: >-
        Optional JSON object mapping relative paths to text contents. Example:
        {"scripts/check.py":"print('ok')","references/notes.md":"# Notes"}
      value: |
        [[BEGIN Additional files JSON]]

        [[END Additional files JSON]]
      render: markdown
    validations:
      required: false
